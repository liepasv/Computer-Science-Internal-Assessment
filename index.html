<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Theory Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-10">
    <div class="w-full max-w-2xl mx-auto px-4">

        <!-- ===== SCREEN 1: Load / Start ===== -->
        <div id="screen-load" class="bg-white rounded-2xl shadow-md p-8">

            <!-- Language switch. It lives on this screen only: changing
                 language swaps the question bank, which must not happen
                 underneath a session that is already running. -->
            <div class="flex justify-end mb-3">
                <div class="inline-flex rounded-lg border border-gray-200 overflow-hidden">
                    <button id="lang-lt" class="px-3 py-1 text-xs font-semibold transition-colors">LT</button>
                    <button id="lang-en" class="px-3 py-1 text-xs font-semibold transition-colors">EN</button>
                </div>
            </div>

            <h1 data-i18n="app.title" class="text-2xl font-bold text-center text-gray-800 mb-1"></h1>
            <p data-i18n="app.subtitle" class="text-center text-sm text-gray-400 mb-8"></p>

            <!-- Profile name: lets several people share one browser without
                 mixing up their saved results. No account is involved. -->
            <div class="mb-5">
                <label for="profile-input" data-i18n="load.profile"
                       class="block text-sm font-medium text-gray-700 mb-2"></label>
                <input
                    type="text"
                    id="profile-input"
                    list="profile-list"
                    maxlength="30"
                    data-i18n-placeholder="load.profilePlaceholder"
                    class="block w-full text-sm text-gray-700 border border-gray-200 rounded-xl px-4 py-2.5
                           focus:outline-none focus:border-blue-400"
                >
                <datalist id="profile-list"></datalist>
            </div>

            <!-- Question source: the bank shipped with the app, or the
                 user's own CSV together with their own images -->
            <div class="mb-5">
                <label data-i18n="load.questions" class="block text-sm font-medium text-gray-700 mb-2"></label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="mode-builtin" data-i18n="load.builtin"
                            class="py-2.5 px-4 text-sm font-medium rounded-xl border transition-colors"></button>
                    <button id="mode-custom" data-i18n="load.custom"
                            class="py-2.5 px-4 text-sm font-medium rounded-xl border transition-colors"></button>
                </div>
            </div>

            <!-- Panel: built-in bank (loaded automatically on start-up) -->
            <div id="source-builtin" class="mb-5">
                <div id="builtin-status" data-i18n="load.builtinLoading"
                     class="text-sm rounded-xl px-4 py-3 bg-gray-50 text-gray-500"></div>

                <!-- Shown only if the automatic load fails, e.g. when the page
                     was opened straight from disk instead of a local server -->
                <div id="builtin-fallback" class="hidden mt-3">
                    <label data-i18n="load.builtinManual"
                           class="block text-sm font-medium text-gray-700 mb-2"></label>
                    <input
                        type="file"
                        id="builtin-csv-input"
                        accept=".csv"
                        class="block w-full text-sm text-gray-500
                               file:mr-4 file:py-2 file:px-4
                               file:rounded-lg file:border-0
                               file:text-sm file:font-medium
                               file:bg-blue-50 file:text-blue-700
                               hover:file:bg-blue-100
                               border border-gray-200 rounded-xl p-2 cursor-pointer"
                    >
                </div>
            </div>

            <!-- Panel: the user's own questions -->
            <div id="source-custom" class="hidden mb-5">
                <label data-i18n="load.customCsv" class="block text-sm font-medium text-gray-700 mb-2"></label>
                <input
                    type="file"
                    id="custom-csv-input"
                    accept=".csv"
                    class="block w-full text-sm text-gray-500 mb-4
                           file:mr-4 file:py-2 file:px-4
                           file:rounded-lg file:border-0
                           file:text-sm file:font-medium
                           file:bg-blue-50 file:text-blue-700
                           hover:file:bg-blue-100
                           border border-gray-200 rounded-xl p-2 cursor-pointer"
                >

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <span data-i18n="load.customImages"></span>
                    <span data-i18n="load.customImagesHint" class="font-normal text-gray-400"></span>
                </label>
                <input
                    type="file"
                    id="custom-images-input"
                    accept="image/*"
                    multiple
                    class="block w-full text-sm text-gray-500
                           file:mr-4 file:py-2 file:px-4
                           file:rounded-lg file:border-0
                           file:text-sm file:font-medium
                           file:bg-blue-50 file:text-blue-700
                           hover:file:bg-blue-100
                           border border-gray-200 rounded-xl p-2 cursor-pointer"
                >
                <p data-i18n-html="load.pictureHelp" class="text-xs text-gray-400 mt-2"></p>
            </div>

            <!-- Load status message -->
            <div id="load-status" class="hidden mb-5 text-sm rounded-xl px-4 py-3"></div>

            <!-- Timer toggle -->
            <div class="mb-6 flex items-center gap-3">
                <input type="checkbox" id="timer-toggle" class="w-4 h-4 accent-blue-600 cursor-pointer">
                <label for="timer-toggle" data-i18n="load.timer"
                       class="text-sm text-gray-700 cursor-pointer"></label>
            </div>

            <!-- Start button (disabled until a bank is loaded) -->
            <button
                id="start-btn"
                disabled
                data-i18n="load.start"
                class="w-full py-3 px-6 bg-blue-600 text-white font-semibold rounded-xl
                       disabled:opacity-40 disabled:cursor-not-allowed
                       hover:bg-blue-700 transition-colors"
            ></button>

            <!-- Practise only the questions answered wrongly before.
                 Its label carries a count, so JavaScript fills it in. -->
            <button
                id="drill-btn"
                disabled
                class="w-full mt-3 py-3 px-6 bg-white text-blue-700 font-semibold rounded-xl
                       border border-blue-200
                       disabled:opacity-40 disabled:cursor-not-allowed
                       hover:bg-blue-50 transition-colors"
            ></button>

            <!-- History screen -->
            <button
                id="history-btn"
                class="w-full mt-3 py-3 px-6 text-gray-600 font-medium rounded-xl
                       border border-gray-200 hover:bg-gray-50 transition-colors"
            ></button>

            <!-- Shown only when the browser refuses to store anything -->
            <div id="storage-warning" class="hidden mt-5 text-sm rounded-xl px-4 py-3 bg-yellow-50 text-yellow-800"></div>

            <!-- Keyboard hint -->
            <p data-i18n-html="load.tip" class="text-center text-xs text-gray-400 mt-4"></p>
        </div>

        <!-- ===== SCREEN 2: Quiz ===== -->
        <div id="screen-quiz" class="hidden bg-white rounded-2xl shadow-md p-8">

            <!-- Header row: progress, timer, score -->
            <div class="flex justify-between items-center mb-5">
                <span id="question-progress" class="text-sm text-gray-500 font-medium"></span>
                <span id="timer-display" class="hidden text-sm font-mono text-gray-600 bg-gray-100 px-3 py-1 rounded-lg">
                    0:00
                </span>
                <span id="score-display" class="text-sm font-semibold text-blue-600"></span>
            </div>

            <!-- Difficulty badge -->
            <div class="mb-4">
                <span id="difficulty-badge" class="text-xs font-semibold px-2 py-1 rounded-full"></span>
            </div>

            <!-- Question image (hidden when no picture) -->
            <div id="question-image-container" class="hidden mb-5 text-center">
                <img
                    id="question-image"
                    src=""
                    data-i18n-alt="quiz.imageAlt"
                    class="max-h-52 rounded-xl mx-auto border border-gray-100"
                >
            </div>

            <!-- Question text -->
            <p id="question-text" class="text-gray-800 font-medium text-base leading-relaxed mb-6"></p>

            <!-- Answer option buttons -->
            <div id="answer-buttons" class="space-y-3"></div>

            <!-- Feedback area (shown after answering) -->
            <div id="feedback-area" class="hidden mt-6 border-t border-gray-100 pt-5">
                <p id="feedback-message" class="font-semibold text-base mb-2"></p>
                <p id="explanation-text" class="text-sm text-gray-600 leading-relaxed mb-5"></p>
                <button
                    id="next-btn"
                    class="w-full py-3 px-6 bg-gray-800 text-white font-semibold rounded-xl
                           hover:bg-gray-900 transition-colors"
                ></button>
            </div>

            <!-- Escape hatch, available at any point in the session -->
            <div class="mt-6 text-center">
                <button
                    id="quit-btn"
                    data-i18n="quiz.quit"
                    class="text-sm text-gray-400 hover:text-red-600 transition-colors"
                ></button>
            </div>
        </div>

        <!-- ===== SCREEN 3: Results ===== -->
        <div id="screen-results" class="hidden bg-white rounded-2xl shadow-md p-8">
            <h2 id="results-title" class="text-2xl font-bold text-center text-gray-800 mb-1"></h2>
            <p data-i18n="results.subtitle" class="text-center text-sm text-gray-400 mb-8"></p>

            <!-- Results content injected by JavaScript -->
            <div id="results-content"></div>

            <button
                id="restart-btn"
                data-i18n="results.restart"
                class="mt-8 w-full py-3 px-6 bg-blue-600 text-white font-semibold rounded-xl
                       hover:bg-blue-700 transition-colors"
            ></button>

            <!-- Repeat only the questions just answered wrongly -->
            <button
                id="results-drill-btn"
                data-i18n="load.drill"
                class="hidden w-full mt-3 py-3 px-6 bg-white text-blue-700 font-semibold rounded-xl
                       border border-blue-200 hover:bg-blue-50 transition-colors"
            ></button>

            <button
                id="results-history-btn"
                data-i18n="load.history"
                class="w-full mt-3 py-3 px-6 text-gray-600 font-medium rounded-xl
                       border border-gray-200 hover:bg-gray-50 transition-colors"
            ></button>
        </div>

        <!-- ===== SCREEN 4: History ===== -->
        <div id="screen-history" class="hidden bg-white rounded-2xl shadow-md p-8">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 data-i18n="history.title" class="text-2xl font-bold text-gray-800"></h2>
                    <p class="text-sm text-gray-400">
                        <span data-i18n="history.profile"></span>
                        <span id="history-profile"></span>
                    </p>
                </div>
                <button
                    id="history-back-btn"
                    data-i18n="history.back"
                    class="text-sm text-gray-500 hover:text-gray-800 border border-gray-200
                           rounded-xl px-4 py-2 transition-colors"
                ></button>
            </div>

            <!-- Statistics, chart, weak spots and session list injected by JavaScript -->
            <div id="history-content"></div>

            <!-- Backup controls: localStorage is wiped if the user clears
                 their browser data, so results can be exported to a file -->
            <div class="mt-8 pt-6 border-t border-gray-100 grid grid-cols-3 gap-3">
                <button id="export-btn" data-i18n="history.export"
                        class="text-sm text-gray-600 border border-gray-200 rounded-xl px-3 py-2 hover:bg-gray-50 transition-colors"></button>
                <button id="import-btn" data-i18n="history.import"
                        class="text-sm text-gray-600 border border-gray-200 rounded-xl px-3 py-2 hover:bg-gray-50 transition-colors"></button>
                <button id="clear-btn" data-i18n="history.clear"
                        class="text-sm text-red-600 border border-red-200 rounded-xl px-3 py-2 hover:bg-red-50 transition-colors"></button>
            </div>
            <input type="file" id="import-input" accept=".json,application/json" class="hidden">
            <div id="history-status" class="hidden"></div>
        </div>

    </div>

    <!-- Load order matters: csv and storage have no dependencies,
         i18n reads the stored language, bank and session use that state,
         history reads storage, app ties everything together -->
    <script src="src/csv.js"></script>
    <script src="src/storage.js"></script>
    <script src="src/i18n.js"></script>
    <script src="src/bank.js"></script>
    <script src="src/session.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/history.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
